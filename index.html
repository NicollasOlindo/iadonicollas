<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>S.A.N. | Interface Neural</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <main class="chat-container">
        <header class="chat-header">
            <div class="brand">
                <div class="brand-mark" aria-hidden="true">S</div>
                <div>
                    <h1>S.A.N.</h1>
                    <p>Assistente neural</p>
                </div>
            </div>
            <div class="header-actions">
                <span class="connection-status"><span id="status-luz" aria-hidden="true"></span> Servidor</span>
                <button id="btnLimpar" type="button">Limpar conversa</button>
            </div>
        </header>
        <section class="workspace-panel" aria-label="Configurações de conversa">
            <div class="workspace-copy">
                <span class="eyebrow">Fonte de contexto</span>
                <span class="workspace-title">Conversa com documento</span>
            </div>
            <label class="switch-control" for="modoDocumento">
                <input type="checkbox" id="modoDocumento">
                <span class="switch-track" aria-hidden="true"><span></span></span>
                Usar documento
            </label>
            <div class="document-options" id="documentOptions" hidden>
                <label class="file-picker" for="docUpload">
                    <span class="file-picker__icon" aria-hidden="true">+</span>
                    <span><strong>Selecionar PDF ou TXT</strong><small id="arquivoSelecionado">Nenhum arquivo selecionado</small></span>
                </label>
                <input type="file" id="docUpload" accept=".pdf,.txt,application/pdf,text/plain">
                <div class="access-fields">
                    <input type="text" id="usuario" placeholder="Usuário" autocomplete="username" aria-label="Usuário">
                    <input type="password" id="senha" placeholder="Senha" autocomplete="current-password" aria-label="Senha">
                    <button id="btnLogin" type="button">Entrar</button>
                    <span id="authStatus" role="status">Entre para consultar documentos</span>
                </div>
            </div>
        </section>
        <section id="caixa-chat" class="chat-box" aria-live="polite">
            <div class="empty-state" id="emptyState">
                <span class="empty-state__mark">S</span>
                <div>
                    <strong>Como posso ajudar?</strong>
                    <p>Envie uma mensagem ou ative o documento para fazer perguntas sobre um arquivo.</p>
                </div>
            </div>
        </section>
        <footer class="chat-input">
            <div class="input-wrap">
                <input type="text" id="campoTexto" placeholder="Envie uma mensagem..." autocomplete="off" maxlength="4000">
                <span>Enter para enviar</span>
            </div>
            <button id="btnEnviar" type="button">Enviar <span aria-hidden="true">↑</span></button>
        </footer>
    </main>
    <script src="index.js"></script>
</body>
</html>
