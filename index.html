<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>S.A.N. | Interface Neural</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <main class="chat-container">
        <header class="chat-header">
            <div style="display: flex; align-items: center; gap: 10px;">
                <h1>S.A.N.</h1>
                <div id="status-luz" title="Status do Servidor" style="width: 12px; height: 12px; border-radius: 50%; background: gray;"></div>
            </div>
            <button id="btnLimpar">☣️ FORMAT</button>
        </header>
        <section id="caixa-chat" class="chat-box"></section>
        <footer class="chat-input">
            <input type="text" id="campoTexto" placeholder="Insira comando..." autocomplete="off">
            <button id="btnEnviar">ENVIAR</button>
        </footer>
    </main>
    <script src="index.js"></script>
</body>
</html>
